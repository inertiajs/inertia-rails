name: Testing

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '**.md'

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Linter
    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler: latest
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: '3.0', rails: '6.1' }
          - { ruby: '3.1', rails: '7.0' }
          - { ruby: '3.2', rails: '7.1' }
          - { ruby: '3.3', rails: '7.2' }
          - { ruby: '3.4', rails: '8.0' }
          - { ruby: '3.4', rails: '8.1' }
          - { ruby: '4.0', rails: '8.1' }
          - { ruby: '4.0', rails: 'main' }

    runs-on: ubuntu-latest
    name: Test against Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    continue-on-error: ${{ matrix.rails == 'main' }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup System
        run: sudo apt-get install libsqlite3-dev

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          rubygems: 'latest'
          bundler-cache: true
        env:
          RAILS_VERSION:  ${{ matrix.rails }}

      - name: Run RSpec
        run: bundle exec rspec --tag ~type:generator
        env:
          RAILS_VERSION: ${{ matrix.rails }}

      - name: Run Minitest
        run: bundle exec rake test
        env:
          RAILS_VERSION: ${{ matrix.rails }}
